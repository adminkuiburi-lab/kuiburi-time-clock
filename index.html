<html lang="th">

<head>

  <meta charset="UTF-8">

    name="viewport"

  <title>KUIBURI TIME CLOCK</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>

    body {
      font-family: Arial, sans-serif;
      background: #f5f6f8;
      margin: 0;
      padding: 20px;

<body>

<div class="box">

  <h2>🏨 KUIBURI TIME CLOCK</h2>

  <div
    id="status"
    class="status info">
    ⏳ กำลังตรวจสอบระบบ...
  </div>


  <div
    id="employee"
    class="employee"
    style="display:none;">
  </div>


  <button
    id="clockInBtn"
    class="in"
    style="display:none;"
    onclick="clockIn()">
    🟢 เข้างาน
  </button>


  <button
    id="clockOutBtn"
    class="out"
    style="display:none;"
    onclick="clockOut()">
    🔴 ออกงาน
  </button>


  <div
    id="result"
    class="status info"
    style="display:none;">
  </div>


  <div class="small">
    LINE LIFF<br>
    KUIBURI TIME CLOCK
  </div>

</div>


<script>


/*************************************************
 * CONFIG
 *************************************************/

const LIFF_ID =
  "2011898137-tsjk9yOf";


const API_URL =
  "https://script.google.com/macros/s/AKfycbyBIompDqCyxMz5M1isnwUbB9kDSgBe_069w_fochpLUaFeIuAOm_6O21X1288-PF7F/exec";


let employee = null;


/*************************************************
 * STATUS
 *************************************************/

function setStatus(
  message,
  type = "info"
) {

  const el =
    document.getElementById(
      "status"
    );

  el.className =
    "status " + type;

  el.innerHTML =
    message;

}


function setResult(
  message,
  type = "info"
) {

  const el =
    document.getElementById(
      "result"
    );

  el.style.display =
    "block";

  el.className =
    "status " + type;

  el.innerHTML =
    message;

}


/*************************************************
 * INIT LIFF
 *************************************************/

async function initLIFF() {

  try {

    setStatus(
      "⏳ กำลังเริ่มระบบ LINE..."
    );


    await liff.init({
      liffId: LIFF_ID
    });


    /*
     * ถ้าเปิดนอก LINE และยังไม่ได้ Login
     */

    if (
      !liff.isLoggedIn()
    ) {

      setStatus(
        "⏳ กำลังเข้าสู่ระบบ LINE..."
      );

      liff.login();

      return;

    }


    /*
     * Login สำเร็จ
     */

    await loadEmployee();


  } catch (error) {

    console.error(error);

    setStatus(

      "❌ ไม่สามารถเริ่มระบบได้<br><br>" +

      escapeHtml(
        error.message ||
        String(error)
      ),

      "bad"

    );

  }

}


/*************************************************
 * LOAD EMPLOYEE
 *************************************************/

async function loadEmployee() {

  try {

    setStatus(
      "⏳ กำลังตรวจสอบข้อมูลพนักงาน..."
    );


    const idToken =
      liff.getIDToken();


    if (!idToken) {

      throw new Error(
        "ไม่พบ LINE ID Token"
      );

    }


    callAPI(

      "profile",

      {
        idToken: idToken
      },

      function(result) {


        if (!result.success) {

          setStatus(

            "❌ " +

            escapeHtml(
              result.message ||
              "ไม่พบข้อมูลพนักงาน"
            ),

            "bad"

          );

          return;

        }


        if (
          !result.authorized
        ) {

          setStatus(
            "❌ LINE นี้ยังไม่ได้ผูกกับพนักงาน",
            "bad"
          );

          return;

        }


        employee =
          result.employee;


        const employeeBox =
          document.getElementById(
            "employee"
          );


        employeeBox.style.display =
          "block";


        employeeBox.innerHTML =

          "👤 " +

          escapeHtml(
            employee.name
          ) +

          "<br>" +

          "<small>" +

          escapeHtml(
            employee.employeeId
          ) +

          " | " +

          escapeHtml(
            employee.department
          ) +

          "<br>" +

          "กะ " +

          escapeHtml(
            employee.shift
          ) +

          " : " +

          escapeHtml(
            employee.shiftStart
          ) +

          " - " +

          escapeHtml(
            employee.shiftEnd
          ) +

          "</small>";


        setStatus(
          "✅ ยืนยันตัวตนสำเร็จ",
          "ok"
        );


        updateButtons(
          result.status
        );

      }

    );


  } catch (error) {

    setStatus(

      "❌ " +

      escapeHtml(
        error.message ||
        String(error)
      ),

      "bad"

    );

  }

}


/*************************************************
 * UPDATE BUTTONS
 *************************************************/

function updateButtons(status) {

  const inBtn =
    document.getElementById(
      "clockInBtn"
    );

  const outBtn =
    document.getElementById(
      "clockOutBtn"
    );


  inBtn.style.display =
    "block";


  outBtn.style.display =
    "block";


  /*
   * ถ้าเข้างานแล้ว
   * ปิดปุ่มเข้างาน
   */

  if (
    status &&
    status.checkedIn
  ) {

    inBtn.disabled = true;

    inBtn.innerHTML =
      "✅ เข้างานแล้ว " +
      (status.checkIn
        ? status.checkIn
        : '');

  }


  /*
   * ถ้าออกงานแล้ว
   */

  if (
    status &&
    status.checkedOut
  ) {

    outBtn.disabled = true;

    outBtn.innerHTML =
      "✅ ออกงานแล้ว " +
      (status.checkOut
        ? status.checkOut
        : '');

  }

}


/*************************************************
 * CLOCK IN
 *************************************************/

function clockIn() {

  const btn =
    document.getElementById(
      "clockInBtn"
    );


  btn.disabled = true;


  setResult(
    "📍 กำลังอ่านตำแหน่ง GPS..."
  );


  getGPS(

    function(lat, lng) {


      setResult(
        "⏳ กำลังบันทึกเวลาเข้างาน..."
      );


      callAPI(

        "clockIn",

        {

          idToken:
            liff.getIDToken(),

          latitude:
            lat,

          longitude:
            lng

        },

        function(result) {


          if (!result.success) {

            btn.disabled = false;


            setResult(

              "❌ " +

              escapeHtml(
                result.message ||
                "ไม่สามารถบันทึกเวลาได้"
              ),

              "bad"

            );

            return;

          }


          setResult(

            "✅ บันทึกเข้างานเรียบร้อย<br><br>" +

            "👤 " +

            escapeHtml(
              result.employee.name
            ) +

            "<br>" +

            "🕐 " +

            escapeHtml(
              result.time
            ) +

            "<br>" +

            "สาย: " +

            escapeHtml(
              String(
                result.lateMinutes || 0
              )
            ) +

            " นาที",

            "ok"

          );


          btn.innerHTML =
            "✅ เข้างานแล้ว " +
            result.time;


          btn.disabled = true;

        }

      );

    }

  );

}


/*************************************************
 * CLOCK OUT
 *************************************************/

function clockOut() {

  const btn =
    document.getElementById(
      "clockOutBtn"
    );


  btn.disabled = true;


  setResult(
    "📍 กำลังอ่านตำแหน่ง GPS..."
  );


  getGPS(

    function(lat, lng) {


      setResult(
        "⏳ กำลังบันทึกเวลาออกงาน..."
      );


      callAPI(

        "clockOut",

        {

          idToken:
            liff.getIDToken(),

          latitude:
            lat,

          longitude:
            lng

        },

        function(result) {


          if (!result.success) {

            btn.disabled = false;


            setResult(

              "❌ " +

              escapeHtml(
                result.message ||
                "ไม่สามารถบันทึกเวลาได้"
              ),

              "bad"

            );

            return;

          }


          setResult(

            "✅ บันทึกออกงานเรียบร้อย<br><br>" +

            "👤 " +

            escapeHtml(
              result.employee.name
            ) +

            "<br>" +

            "🕐 " +

            escapeHtml(
              result.time
            ) +

            "<br>" +

            "เวลาทำงาน: " +

            escapeHtml(
              result.workTime
            ) +

            "<br>" +

            "OT: " +

            escapeHtml(
              String(
                result.otHours || 0
              )
            ) +

            " ชั่วโมง",

            "ok"

          );


          btn.innerHTML =
            "✅ ออกงานแล้ว " +
            result.time;


          btn.disabled = true;

        }

      );

    }

  );

}


/*************************************************
 * GPS
 *************************************************/

function getGPS(
  callback
) {

  if (
    !navigator.geolocation
  ) {

    setResult(
      "❌ อุปกรณ์ไม่รองรับ GPS",
      "bad"
    );

    return;

  }


  navigator.geolocation.getCurrentPosition(

    function(position) {

      callback(

        position.coords.latitude,

        position.coords.longitude

      );

    },


    function(error) {

      let message =
        "ไม่สามารถอ่านตำแหน่งได้";


      if (error.code === 1) {

        message =
          "กรุณาอนุญาตให้ระบบใช้ตำแหน่ง GPS";

      }


      if (error.code === 2) {

        message =
          "ไม่สามารถระบุตำแหน่งได้";

      }


      if (error.code === 3) {

        message =
          "GPS ใช้เวลานานเกินไป";

      }


      setResult(
        "❌ " + message,
        "bad"
      );


      document
        .getElementById(
          "clockInBtn"
        )
        .disabled = false;


      document
        .getElementById(
          "clockOutBtn"
        )
        .disabled = false;

    },


    {

      enableHighAccuracy:
        true,

      timeout:
        15000,

      maximumAge:
        0

    }

  );

}


/*************************************************
 * CALL API
 *************************************************/

function callAPI(
  action,
  params,
  callback
) {

  const callbackName =
    "apiCallback_" +
    Date.now();


  window[callbackName] =
    function(result) {

      try {

        callback(result);

      }

      finally {

        delete window[
          callbackName
        ];

        if (
          script &&
          script.parentNode
        ) {

          script.parentNode
            .removeChild(
              script
            );

        }

      }

    };


  const query =
    new URLSearchParams();


  query.set(
    "api",
    "1"
  );


  query.set(
    "action",
    action
  );


  query.set(
    "callback",
    callbackName
  );


  Object.keys(params)
    .forEach(function(key) {

      query.set(
        key,
        params[key]
      );

    });


  const script =
    document.createElement(
      "script"
    );


  script.src =
    API_URL +
    "?" +
    query.toString();


  script.onerror =
    function() {

      callback({

        success: false,

        message:
          "ไม่สามารถเชื่อมต่อ API ได้"

      });

    };


  document
    .body
    .appendChild(
      script
    );

}


/*************************************************
 * ESCAPE HTML
 *************************************************/

function escapeHtml(
  text
) {

  return String(
    text || ''
  )

  .replace(
    /&/g,
    '&amp;'
  )

  .replace(
    /</g,
    '&lt;'
  )

  .replace(
    />/g,
    '&gt;'
  )

  .replace(
    /"/g,
    '&quot;'
  )

  .replace(
    /'/g,
    '&#039;'
  );

}


/*************************************************
 * START
 *************************************************/

initLIFF();

</script>

</body>
</html>
