<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>KUIBURI TIME CLOCK</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        Arial,
        "Noto Sans Thai",
        sans-serif;

      background: #f4f6f8;

      color: #222;
    }

    .container {
      max-width: 480px;

      margin: 0 auto;

      padding: 20px;
    }

    .header {
      text-align: center;

      margin-bottom: 20px;
    }

    .hotel {
      font-size: 24px;

      font-weight: bold;

      margin-bottom: 5px;
    }

    .subtitle {
      color: #666;

      font-size: 15px;
    }

    .card {
      background: white;

      border-radius: 18px;

      padding: 20px;

      margin-bottom: 16px;

      box-shadow:
        0 3px 12px
        rgba(0,0,0,0.08);
    }

    .profile {
      text-align: center;
    }

    .profile img {
      width: 80px;

      height: 80px;

      border-radius: 50%;

      object-fit: cover;

      margin-bottom: 10px;
    }

    .name {
      font-size: 20px;

      font-weight: bold;

      margin-bottom: 6px;
    }

    .info {
      color: #666;

      line-height: 1.7;

      font-size: 14px;
    }

    .status {
      margin-top: 15px;

      padding: 12px;

      border-radius: 12px;

      text-align: center;

      background: #f1f3f5;
    }

    .status.ok {
      background: #e8f7ed;

      color: #19763b;
    }

    .status.work {
      background: #fff4d6;

      color: #8a6500;
    }

    button {
      width: 100%;

      border: 0;

      border-radius: 14px;

      padding: 16px;

      font-size: 18px;

      font-weight: bold;

      cursor: pointer;

      margin-top: 10px;
    }

    button:disabled {
      opacity: 0.5;

      cursor: not-allowed;
    }

    .btn-in {
      background: #198754;

      color: white;
    }

    .btn-out {
      background: #dc3545;

      color: white;
    }

    .message {
      text-align: center;

      padding: 15px;

      border-radius: 12px;

      margin-top: 15px;

      display: none;

      white-space: pre-line;
    }

    .message.success {
      display: block;

      background: #e8f7ed;

      color: #176b37;
    }

    .message.error {
      display: block;

      background: #fdeaea;

      color: #a12222;
    }

    .loading {
      text-align: center;

      padding: 30px;

      color: #666;
    }

    .gps {
      font-size: 13px;

      color: #777;

      text-align: center;

      margin-top: 12px;
    }

    .footer {
      text-align: center;

      color: #999;

      font-size: 12px;

      margin-top: 20px;
    }

  </style>
</head>


<body>

<div class="container">


  <div class="header">

    <div class="hotel">
      🏨 KUIBURI TIME CLOCK
    </div>

    <div class="subtitle">
      ระบบบันทึกเวลาเข้า - ออกงาน
    </div>

  </div>


  <!-- LOADING -->

  <div id="loading"
       class="card loading">

    กำลังเชื่อมต่อ LINE...

  </div>


  <!-- PROFILE -->

  <div id="profileCard"
       class="card profile"
       style="display:none;">

    <img id="profileImage"
         src=""
         alt="LINE Profile">

    <div id="employeeName"
         class="name">
    </div>

    <div id="employeeInfo"
         class="info">
    </div>

    <div id="todayStatus"
         class="status">
    </div>

  </div>


  <!-- ACTION -->

  <div id="actionCard"
       class="card"
       style="display:none;">

    <button id="clockInBtn"
            class="btn-in"
            onclick="clockIn()">

      🟢 เข้างาน

    </button>


    <button id="clockOutBtn"
            class="btn-out"
            onclick="clockOut()">

      🔴 ออกงาน

    </button>


    <div id="gpsStatus"
         class="gps">

      📍 กำลังเตรียม GPS...

    </div>


    <div id="message"
         class="message">
    </div>

  </div>


  <div class="footer">

    KUIBURI HOTEL & RESORT

  </div>


</div>


<script>

/*************************************************
 * CONFIG
 *************************************************/

const LIFF_ID =
  '2011898137-tsjk9yOf';


const API_URL =
  'https://script.google.com/macros/s/AKfycbzbJpjqrCMCr-FvlS841lQt7mEB8b9rl0ybrlCquhoWvhJwGJ2nOQgBbvmEgqlSzeZ6/exec';


let lineUserId = '';

let employee = null;


/*************************************************
 * START
 *************************************************/

window.onload = async function() {

  try {

    await liff.init({
      liffId: LIFF_ID
    });


    if (!liff.isLoggedIn()) {

      liff.login();

      return;

    }


    /*
     * อ่าน LINE Profile
     */

    const profile =
      await liff.getProfile();


    lineUserId =
      String(
        profile.userId || ''
      ).trim();


    if (!lineUserId) {

      throw new Error(
        'ไม่สามารถอ่าน LINE User ID ได้'
      );

    }


    /*
     * โหลดข้อมูลพนักงาน
     */

    await loadProfile();

  }

  catch (error) {

    showError(
      error.message ||
      'ไม่สามารถเชื่อมต่อระบบได้'
    );

  }

};


/*************************************************
 * LOAD PROFILE
 *************************************************/

async function loadProfile() {

  showLoading(
    'กำลังตรวจสอบข้อมูลพนักงาน...'
  );

  const result =
    await callAPI(
      'profile'
    );


  if (!result.success) {

    throw new Error(
      result.message ||
      'ไม่สามารถโหลดข้อมูลพนักงานได้'
    );

  }


  if (!result.authorized) {

    throw new Error(
      'LINE นี้ยังไม่ได้ผูกกับข้อมูลพนักงาน'
    );

  }


  employee =
    result.employee;


  displayProfile(
    result
  );


  hideLoading();

}


/*************************************************
 * DISPLAY PROFILE
 *************************************************/

function displayProfile(
  result
) {

  document
    .getElementById(
      'profileCard'
    )
    .style.display =
      'block';


  document
    .getElementById(
      'actionCard'
    )
    .style.display =
      'block';


  document
    .getElementById(
      'employeeName'
    )
    .textContent =
      employee.name;


  document
    .getElementById(
      'employeeInfo'
    )
    .innerHTML =

      'รหัสพนักงาน: ' +
      employee.employeeId +

      '<br>' +

      employee.department +

      '<br>' +

      employee.shiftName +

      ' — ' +

      employee.shiftStart +

      '–' +

      employee.shiftEnd;


  /*
   * รูป LINE
   */

  /*
   * profile picture จะโหลดแยก
   */

  loadLinePicture();


  updateStatus(
    result.status
  );

}


/*************************************************
 * LOAD LINE PICTURE
 *************************************************/

async function loadLinePicture() {

  try {

    const profile =
      await liff.getProfile();


    if (
      profile.pictureUrl
    ) {

      document
        .getElementById(
          'profileImage'
        )
        .src =
          profile.pictureUrl;

    }

  }

  catch (error) {

    console.log(
      error
    );

  }

}


/*************************************************
 * STATUS
 *************************************************/

function updateStatus(
  status
) {

  const box =
    document.getElementById(
      'todayStatus'
    );


  if (!status) {

    box.textContent =
      'สถานะวันนี้: ยังไม่มีข้อมูล';

    return;

  }


  let text =
    'สถานะวันนี้: ';


  if (
    status.clockIn
  ) {

    text +=
      'เข้างานแล้ว ' +
      status.clockIn;

  }

  else {

    text +=
      'ยังไม่ได้เข้างาน';

  }


  if (
    status.clockOut
  ) {

    text +=
      ' | ออกงาน ' +
      status.clockOut;

  }


  box.textContent =
    text;


  if (
    status.clockOut
  ) {

    box.className =
      'status ok';

  }

  else if (
    status.clockIn
  ) {

    box.className =
      'status work';

  }

  else {

    box.className =
      'status';

  }


  /*
   * ป้องกันกดซ้ำ
   */

  document
    .getElementById(
      'clockInBtn'
    )
    .disabled =
      !!status.clockIn;


  document
    .getElementById(
      'clockOutBtn'
    )
    .disabled =
      !status.clockIn ||
      !!status.clockOut;

}


/*************************************************
 * CLOCK IN
 *************************************************/

async function clockIn() {

  clearMessage();


  try {

    disableButtons();


    showMessage(
      'กำลังอ่านตำแหน่ง GPS...',
      false
    );


    const gps =
      await getGPS();


    document
      .getElementById(
        'gpsStatus'
      )
      .textContent =

        '📍 GPS: ' +
        gps.latitude.toFixed(6) +
        ', ' +
        gps.longitude.toFixed(6);


    showMessage(
      'กำลังบันทึกเวลาเข้างาน...',
      false
    );


    const result =
      await callAPI(
        'clockIn',
        gps
      );


    if (!result.success) {

      throw new Error(
        result.message ||
        'ไม่สามารถบันทึกเวลาเข้างานได้'
      );

    }


    let text =
      'เข้างานเรียบร้อยค่ะ\n' +
      'เวลา: ' +
      result.time;


    if (
      Number(
        result.lateMinutes || 0
      ) > 0
    ) {

      text +=
        '\nสาย: ' +
        result.lateMinutes +
        ' นาที';

    }

    else {

      text +=
        '\nสถานะ: ปกติ';

    }


    showSuccess(
      text
    );


    await loadProfile();

  }

  catch (error) {

    showError(
      error.message
    );


    enableButtons();

  }

}


/*************************************************
 * CLOCK OUT
 *************************************************/

async function clockOut() {

  clearMessage();


  try {

    disableButtons();


    showMessage(
      'กำลังอ่านตำแหน่ง GPS...',
      false
    );


    const gps =
      await getGPS();


    document
      .getElementById(
        'gpsStatus'
      )
      .textContent =

        '📍 GPS: ' +
        gps.latitude.toFixed(6) +
        ', ' +
        gps.longitude.toFixed(6);


    showMessage(
      'กำลังบันทึกเวลาออกงาน...',
      false
    );


    const result =
      await callAPI(
        'clockOut',
        gps
      );


    if (!result.success) {

      throw new Error(
        result.message ||
        'ไม่สามารถบันทึกเวลาออกงานได้'
      );

    }


    let text =
      'ออกงานเรียบร้อยค่ะ\n' +
      'เวลา: ' +
      result.time;


    if (
      Number(
        result.otHours || 0
      ) > 0
    ) {

      text +=
        '\n⭐ OT: ' +
        result.otHours +
        ' ชั่วโมง';

    }

    else {

      text +=
        '\nไม่มี OT';

    }


    if (
      result.workTime
    ) {

      text +=
        '\nเวลาทำงาน: ' +
        result.workTime;

    }


    showSuccess(
      text
    );


    await loadProfile();

  }

  catch (error) {

    showError(
      error.message
    );


    enableButtons();

  }

}


/*************************************************
 * CALL API
 *************************************************/

function callAPI(
  action,
  gps
) {

  return new Promise(
    function(resolve, reject) {


      const callbackName =
        'apiCallback_' +
        Date.now() +
        '_' +
        Math.floor(
          Math.random() * 100000
        );


      const params =
        new URLSearchParams();


      params.set(
        'api',
        '1'
      );


      params.set(
        'action',
        action
      );


      params.set(
        'userId',
        lineUserId
      );


      params.set(
        'callback',
        callbackName
      );


      /*
       * GPS
       */

      if (gps) {

        params.set(
          'latitude',
          String(
            gps.latitude
          )
        );


        params.set(
          'longitude',
          String(
            gps.longitude
          )
        );

      }


      const script =
        document.createElement(
          'script'
        );


      let finished =
        false;


      const timer =
        setTimeout(
          function() {

            if (finished) {
              return;
            }


            finished = true;


            cleanup();


            reject(
              new Error(
                'API ไม่ตอบสนอง'
              )
            );

          },
          15000
        );


      window[
        callbackName
      ] =
        function(data) {

          if (finished) {
            return;
          }


          finished = true;


          clearTimeout(
            timer
          );


          cleanup();


          resolve(
            data
          );

        };


      function cleanup() {

        try {

          delete window[
            callbackName
          ];

        }

        catch (error) {}


        if (
          script.parentNode
        ) {

          script.parentNode
            .removeChild(
              script
            );

        }

      }


      script.onerror =
        function() {

          if (finished) {
            return;
          }


          finished = true;


          clearTimeout(
            timer
          );


          cleanup();


          reject(
            new Error(
              'ไม่สามารถเชื่อมต่อ API ได้'
            )
          );

        };


      script.src =
        API_URL +
        '?' +
        params.toString();


      document
        .body
        .appendChild(
          script
        );

    }
  );

}


/*************************************************
 * GPS
 *************************************************/

function getGPS() {

  return new Promise(
    function(resolve, reject) {

      if (
        !navigator.geolocation
      ) {

        reject(
          new Error(
            'อุปกรณ์นี้ไม่รองรับ GPS'
          )
        );

        return;

      }


      navigator.geolocation.getCurrentPosition(

        function(position) {

          resolve({

            latitude:
              position.coords.latitude,

            longitude:
              position.coords.longitude

          });

        },

        function(error) {

          let message =
            'ไม่สามารถอ่านตำแหน่ง GPS ได้';


          if (
            error.code ===
            1
          ) {

            message =
              'กรุณาอนุญาตให้ระบบเข้าถึงตำแหน่ง GPS';

          }


          reject(
            new Error(
              message
            )
          );

        },

        {

          enableHighAccuracy:
            true,

          timeout:
            15000,

          maximumAge:
            0

        }

      );

    }
  );

}


/*************************************************
 * UI
 *************************************************/

function showLoading(
  text
) {

  const loading =
    document.getElementById(
      'loading'
    );


  loading.textContent =
    text;


  loading.style.display =
    'block';

}


function hideLoading() {

  document
    .getElementById(
      'loading'
    )
    .style.display =
      'none';

}


function showMessage(
  text
) {

  const box =
    document.getElementById(
      'message'
    );


  box.className =
    'message';


  box.textContent =
    text;


  box.style.display =
    'block';

}


function showSuccess(
  text
) {

  const box =
    document.getElementById(
      'message'
    );


  box.className =
    'message success';


  box.textContent =
    text;


  box.style.display =
    'block';

}


function showError(
  text
) {

  const loading =
    document.getElementById(
      'loading'
    );


  loading.style.display =
    'block';


  loading.textContent =
    '❌ ' +
    (
      text ||
      'เกิดข้อผิดพลาด'
    );


  loading.style.color =
    '#a12222';

}


function clearMessage() {

  const box =
    document.getElementById(
      'message'
    );


  box.style.display =
    'none';

}


function disableButtons() {

  document
    .getElementById(
      'clockInBtn'
    )
    .disabled =
      true;


  document
    .getElementById(
      'clockOutBtn'
    )
    .disabled =
      true;

}


function enableButtons() {

  document
    .getElementById(
      'clockInBtn'
    )
    .disabled =
      false;


  document
    .getElementById(
      'clockOutBtn'
    )
    .disabled =
      false;

}

</script>

</body>
</html>
