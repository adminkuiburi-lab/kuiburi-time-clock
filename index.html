<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>KUIBURI TIME CLOCK</title>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, "Noto Sans Thai", sans-serif;
  background: #f4f6f8;
  color: #222;
}

.container {
  max-width: 480px;
  margin: auto;
  padding: 20px;
}

.card {
  background: white;
  border-radius: 18px;
  padding: 22px;
  margin-bottom: 16px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

.hotel {
  text-align: center;
  font-size: 14px;
  color: #777;
  margin-bottom: 5px;
}

.title {
  text-align: center;
  font-size: 25px;
  font-weight: bold;
  margin: 0 0 5px;
}

.subtitle {
  text-align: center;
  color: #777;
  font-size: 14px;
}

.profile {
  display: grid;
  grid-template-columns: 90px 1fr;
  gap: 8px;
  font-size: 15px;
}

.label {
  color: #777;
}

.value {
  font-weight: bold;
}

.status {
  text-align: center;
  padding: 16px;
  border-radius: 14px;
  background: #f1f3f5;
  margin-top: 15px;
}

.status-title {
  font-size: 20px;
  font-weight: bold;
}

.status-detail {
  margin-top: 8px;
  line-height: 1.8;
  color: #555;
}

button {
  width: 100%;
  border: none;
  border-radius: 14px;
  padding: 17px;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
  margin-top: 10px;
}

.btn-in {
  background: #198754;
  color: white;
}

.btn-out {
  background: #dc3545;
  color: white;
}

button:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}

.message {
  padding: 14px;
  border-radius: 12px;
  margin-top: 15px;
  display: none;
  text-align: center;
  white-space: pre-line;
}

.message.success {
  display: block;
  background: #d1e7dd;
  color: #0f5132;
}

.message.error {
  display: block;
  background: #f8d7da;
  color: #842029;
}

.loading {
  position: fixed;
  inset: 0;
  background: rgba(255,255,255,0.95);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9999;
  font-size: 18px;
}

.hidden {
  display: none !important;
}

.gps {
  font-size: 13px;
  color: #777;
  margin-top: 10px;
  text-align: center;
}

</style>

</head>

<body>

<div
  id="loading"
  class="loading"
>
  กำลังเชื่อมต่อระบบ...
</div>


<div
  class="container"
  id="app"
  style="display:none;"
>

  <!-- HEADER -->

  <div class="card">

    <div class="hotel">
      KUIBURI HOTEL & RESORT
    </div>

    <h1 class="title">
      KUIBURI TIME CLOCK
    </h1>

    <div class="subtitle">
      ระบบบันทึกเวลาเข้า - ออกงาน
    </div>

  </div>


  <!-- PROFILE -->

  <div class="card">

    <div class="profile">

      <div class="label">
        รหัสพนักงาน
      </div>

      <div
        class="value"
        id="employeeId"
      >
        -
      </div>


      <div class="label">
        ชื่อ
      </div>

      <div
        class="value"
        id="employeeName"
      >
        -
      </div>


      <div class="label">
        แผนก
      </div>

      <div
        class="value"
        id="employeeDepartment"
      >
        -
      </div>


      <div class="label">
        กะ
      </div>

      <div
        class="value"
        id="employeeShift"
      >
        -
      </div>


      <div class="label">
        เวลา
      </div>

      <div
        class="value"
        id="employeeShiftTime"
      >
        -
      </div>

    </div>

  </div>


  <!-- STATUS -->

  <div class="card">

    <div class="status">

      <div
        class="status-title"
        id="statusTitle"
      >
        กำลังตรวจสอบ...
      </div>


      <div
        class="status-detail"
        id="statusDetail"
      >
        -
      </div>

    </div>


    <div
      id="gpsStatus"
      class="gps"
    >
      ระบบจะขอตำแหน่ง GPS เมื่อกดเข้างานหรือออกงาน
    </div>


    <button
      id="clockInBtn"
      class="btn-in"
      onclick="handleClockIn()"
    >
      🟢 เข้างาน
    </button>


    <button
      id="clockOutBtn"
      class="btn-out"
      onclick="handleClockOut()"
    >
      🔴 ออกงาน
    </button>


    <div
      id="message"
      class="message"
    ></div>

  </div>

</div>


<script>

/* =================================================
 * CONFIG
 * ================================================= */

const LIFF_ID =
  '2011898137-tsjk9yOf';


const API_URL =
  'https://script.google.com/macros/s/AKfycbzlrkbwA4YsXhCOTwuqHneIVeGIYjbthK7qpsAvMsKfXAkEytP28hh0WE04wqf25_ZI/exec';


/* =================================================
 * GLOBAL
 * ================================================= */

let lineUserId = '';

let employee = null;

let currentStatus = null;


/* =================================================
 * INIT
 * ================================================= */

window.addEventListener(
  'load',
  init
);


async function init() {

  try {

    showLoading(
      'กำลังเชื่อมต่อ LINE...'
    );


    await liff.init({
      liffId: LIFF_ID
    });


    if (!liff.isLoggedIn()) {

      liff.login();

      return;

    }


    const profile =
      await liff.getProfile();


    lineUserId =
      String(
        profile.userId || ''
      ).trim();


    if (!lineUserId) {

      throw new Error(
        'ไม่สามารถอ่าน LINE User ID ได้'
      );

    }


    await loadProfile();

    await loadStatus();


    hideLoading();


    document
      .getElementById('app')
      .style.display = 'block';


  } catch (err) {

    console.error(err);

    showFatalError(
      err.message ||
      String(err)
    );

  }

}


/* =================================================
 * LOAD PROFILE
 * ================================================= */

async function loadProfile() {

  const result =
    await callAPI('profile');


  console.log(
    'PROFILE RESULT',
    result
  );


  if (!result.success) {

    throw new Error(
      result.error ||
      'ไม่สามารถโหลดข้อมูลพนักงานได้'
    );

  }


  if (
    result.authorized !== true &&
    !result.employee
  ) {

    throw new Error(
      'LINE นี้ยังไม่ได้ผูกกับข้อมูลพนักงาน'
    );

  }


  if (!result.employee) {

    throw new Error(
      'ไม่พบข้อมูลพนักงาน'
    );

  }


  employee =
    result.employee;


  displayProfile(
    result
  );

}


/* =================================================
 * DISPLAY PROFILE
 * ================================================= */

function displayProfile(result) {

  const emp =
    result.employee;


  const employeeId =
    emp.id ||
    emp.employeeId ||
    '-';


  document
    .getElementById('employeeId')
    .textContent =
      employeeId;


  document
    .getElementById('employeeName')
    .textContent =
      emp.name ||
      '-';


  document
    .getElementById('employeeDepartment')
    .textContent =
      emp.department ||
      '-';


  const shiftText =
    emp.shiftName ||
    emp.shift ||
    '-';


  document
    .getElementById('employeeShift')
    .textContent =
      shiftText;


  /*
   * แก้ปัญหา
   * [object Object]
   */

  const start =
    formatShiftTime(
      emp.shiftStart
    );


  const end =
    formatShiftTime(
      emp.shiftEnd
    );


  document
    .getElementById('employeeShiftTime')
    .textContent =
      start && end
        ? start + ' - ' + end
        : '-';

}


/* =================================================
 * FORMAT SHIFT TIME
 *
 * รองรับหลายรูปแบบ
 * ================================================= */

function formatShiftTime(value) {

  if (
    value === null ||
    value === undefined ||
    value === ''
  ) {

    return '';

  }


  /*
   * กรณีเป็นข้อความ
   * เช่น 08:00
   */

  if (
    typeof value === 'string'
  ) {

    /*
     * ถ้ามีรูปแบบ HH:mm อยู่แล้ว
     */

    const match =
      value.match(
        /(\d{1,2}):(\d{2})/
      );


    if (match) {

      return (
        String(
          Number(match[1])
        ).padStart(2, '0')
        +
        ':'
        +
        match[2]
      );

    }


    return value;

  }


  /*
   * กรณีเป็น Object
   */

  if (
    typeof value === 'object'
  ) {

    /*
     * hours / minutes
     */

    if (
      value.hours !== undefined &&
      value.minutes !== undefined
    ) {

      return formatHourMinute(
        value.hours,
        value.minutes
      );

    }


    /*
     * hour / minute
     */

    if (
      value.hour !== undefined &&
      value.minute !== undefined
    ) {

      return formatHourMinute(
        value.hour,
        value.minute
      );

    }


    /*
     * h / m
     */

    if (
      value.h !== undefined &&
      value.m !== undefined
    ) {

      return formatHourMinute(
        value.h,
        value.m
      );

    }


    /*
     * ถ้า Object มี toString
     */

    try {

      const text =
        String(value);


      if (
        text !== '[object Object]'
      ) {

        return text;

      }

    } catch (e) {}

  }


  return '';

}


/* =================================================
 * FORMAT HOUR + MINUTE
 * ================================================= */

function formatHourMinute(
  hour,
  minute
) {

  const h =
    Number(hour) || 0;


  const m =
    Number(minute) || 0;


  return (
    String(h).padStart(2, '0')
    +
    ':'
    +
    String(m).padStart(2, '0')
  );

}


/* =================================================
 * LOAD STATUS
 * ================================================= */

async function loadStatus() {

  const result =
    await callAPI('status');


  console.log(
    'STATUS RESULT',
    result
  );


  if (!result.success) {

    throw new Error(
      result.error ||
      'ไม่สามารถตรวจสอบสถานะได้'
    );

  }


  currentStatus =
    result.status;


  displayStatus(
    result.status
  );

}


/* =================================================
 * DISPLAY STATUS
 * ================================================= */

function displayStatus(status) {

  if (!status) {
    return;
  }


  const title =
    document.getElementById(
      'statusTitle'
    );


  const detail =
    document.getElementById(
      'statusDetail'
    );


  const clockInBtn =
    document.getElementById(
      'clockInBtn'
    );


  const clockOutBtn =
    document.getElementById(
      'clockOutBtn'
    );


  title.textContent =
    status.text ||
    '-';


  let html = '';


  if (status.checkIn) {

    html +=
      'เวลาเข้า: ' +
      status.checkIn +
      '<br>';

  }


  if (status.checkOut) {

    html +=
      'เวลาออก: ' +
      status.checkOut +
      '<br>';

  }


  if (
    Number(
      status.lateMinutes || 0
    ) > 0
  ) {

    html +=
      'สาย: ' +
      Number(
        status.lateMinutes
      ) +
      ' นาที<br>';

  }


  if (status.workTime) {

    html +=
      'เวลาทำงาน: ' +
      status.workTime +
      '<br>';

  }


  if (
    Number(
      status.otHours || 0
    ) > 0
  ) {

    html +=
      'OT: ' +
      Number(
        status.otHours
      ).toFixed(2) +
      ' ชั่วโมง<br>';

  }


  if (status.otStatus) {

    html +=
      'สถานะ OT: ' +
      status.otStatus;

  }


  detail.innerHTML =
    html || '';


  /*
   * ควบคุมปุ่ม
   */

  if (
    status.state ===
    'NOT_STARTED'
  ) {

    clockInBtn.disabled =
      false;

    clockOutBtn.disabled =
      true;

  }
  else if (
    status.state ===
    'CLOCKED_IN'
  ) {

    clockInBtn.disabled =
      true;

    clockOutBtn.disabled =
      false;

  }
  else if (
    status.state ===
    'CLOCKED_OUT'
  ) {

    clockInBtn.disabled =
      true;

    clockOutBtn.disabled =
      true;

  }
  else {

    clockInBtn.disabled =
      false;

    clockOutBtn.disabled =
      true;

  }

}


/* =================================================
 * API CALL
 * ================================================= */

function callAPI(
  action,
  extraParams = {}
) {

  return new Promise(
    function(resolve, reject) {

      const callbackName =
        'apiCallback_' +
        Date.now() +
        '_' +
        Math.floor(
          Math.random() * 100000
        );


      const params =
        new URLSearchParams();


      params.set(
        'api',
        '1'
      );


      params.set(
        'action',
        action
      );


      params.set(
        'userId',
        lineUserId
      );


      params.set(
        'callback',
        callbackName
      );


      Object.keys(
        extraParams
      ).forEach(
        function(key) {

          params.set(
            key,
            extraParams[key]
          );

        }
      );


      const script =
        document.createElement(
          'script'
        );


      const timeout =
        setTimeout(
          function() {

            cleanup();

            reject(
              new Error(
                'เชื่อมต่อระบบไม่สำเร็จ'
              )
            );

          },
          20000
        );


      window[callbackName] =
        function(data) {

          cleanup();

          resolve(data);

        };


      script.src =
        API_URL +
        '?' +
        params.toString();


      script.onerror =
        function() {

          cleanup();

          reject(
            new Error(
              'ไม่สามารถเชื่อมต่อ API ได้'
            )
          );

        };


      document
        .body
        .appendChild(
          script
        );


      function cleanup() {

        clearTimeout(
          timeout
        );


        if (
          script.parentNode
        ) {

          script.parentNode
            .removeChild(
              script
            );

        }


        try {

          delete window[
            callbackName
          ];

        } catch (e) {}

      }

    }
  );

}


/* =================================================
 * CLOCK IN
 * ================================================= */

async function handleClockIn() {

  clearMessage();


  try {

    setButtonsDisabled(true);


    showMessage(
      'กำลังอ่านตำแหน่ง GPS...',
      'success'
    );


    const position =
      await getGPS();


    showMessage(
      'กำลังบันทึกเวลาเข้างาน...',
      'success'
    );


    const result =
      await callAPI(
        'clockIn',
        {
          latitude:
            position.latitude,

          longitude:
            position.longitude
        }
      );


    if (!result.success) {

      throw new Error(
        result.error ||
        'ไม่สามารถบันทึกเวลาเข้างานได้'
      );

    }


    showMessage(
      result.message ||
      'บันทึกเวลาเข้างานเรียบร้อย',
      'success'
    );


    await loadStatus();


  } catch (err) {

    console.error(err);


    showMessage(
      err.message ||
      String(err),
      'error'
    );


  } finally {

    setButtonsDisabled(false);


    if (currentStatus) {

      displayStatus(
        currentStatus
      );

    }

  }

}


/* =================================================
 * CLOCK OUT
 * ================================================= */

async function handleClockOut() {

  clearMessage();


  try {

    setButtonsDisabled(true);


    showMessage(
      'กำลังอ่านตำแหน่ง GPS...',
      'success'
    );


    const position =
      await getGPS();


    showMessage(
      'กำลังบันทึกเวลาออกงาน...',
      'success'
    );


    const result =
      await callAPI(
        'clockOut',
        {
          latitude:
            position.latitude,

          longitude:
            position.longitude
        }
      );


    if (!result.success) {

      throw new Error(
        result.error ||
        'ไม่สามารถบันทึกเวลาออกงานได้'
      );

    }


    let message =
      result.message ||
      'บันทึกเวลาออกงานเรียบร้อย';


    if (
      Number(
        result.otHours || 0
      ) > 0
    ) {

      message +=
        '\nOT ' +
        Number(
          result.otHours
        ).toFixed(2) +
        ' ชั่วโมง';


      if (
        result.otStatus
      ) {

        message +=
          '\nสถานะ: ' +
          result.otStatus;

      }

    }


    showMessage(
      message,
      'success'
    );


    await loadStatus();


  } catch (err) {

    console.error(err);


    showMessage(
      err.message ||
      String(err),
      'error'
    );


  } finally {

    setButtonsDisabled(false);


    if (currentStatus) {

      displayStatus(
        currentStatus
      );

    }

  }

}


/* =================================================
 * GPS
 * ================================================= */

function getGPS() {

  return new Promise(
    function(resolve, reject) {

      if (
        !navigator.geolocation
      ) {

        reject(
          new Error(
            'อุปกรณ์นี้ไม่รองรับ GPS'
          )
        );

        return;

      }


      navigator.geolocation.getCurrentPosition(

        function(position) {

          const latitude =
            position.coords.latitude;


          const longitude =
            position.coords.longitude;


          document
            .getElementById(
              'gpsStatus'
            )
            .textContent =
              'GPS พร้อมใช้งาน';


          resolve({
            latitude:
              latitude,

            longitude:
              longitude
          });

        },


        function(error) {

          let message =
            'ไม่สามารถอ่านตำแหน่ง GPS ได้';


          if (
            error.code === 1
          ) {

            message =
              'กรุณาอนุญาตการเข้าถึงตำแหน่ง GPS';

          }


          if (
            error.code === 2
          ) {

            message =
              'ไม่สามารถระบุตำแหน่ง GPS ได้';

          }


          if (
            error.code === 3
          ) {

            message =
              'อ่านตำแหน่ง GPS ใช้เวลานานเกินไป';

          }


          reject(
            new Error(message)
          );

        },


        {
          enableHighAccuracy:
            true,

          timeout:
            15000,

          maximumAge:
            0
        }

      );

    }
  );

}


/* =================================================
 * BUTTONS
 * ================================================= */

function setButtonsDisabled(
  disabled
) {

  document
    .getElementById(
      'clockInBtn'
    )
    .disabled =
      disabled;


  document
    .getElementById(
      'clockOutBtn'
    )
    .disabled =
      disabled;

}


/* =================================================
 * MESSAGE
 * ================================================= */

function showMessage(
  message,
  type
) {

  const el =
    document.getElementById(
      'message'
    );


  el.textContent =
    message || '';


  el.className =
    'message ' +
    (
      type || ''
    );

}


function clearMessage() {

  const el =
    document.getElementById(
      'message'
    );


  el.textContent =
    '';


  el.className =
    'message';

}


/* =================================================
 * LOADING
 * ================================================= */

function showLoading(text) {

  const el =
    document.getElementById(
      'loading'
    );


  el.textContent =
    text ||
    'กำลังโหลด...';


  el.classList.remove(
    'hidden'
  );

}


function hideLoading() {

  document
    .getElementById(
      'loading'
    )
    .classList.add(
      'hidden'
    );

}


/* =================================================
 * FATAL ERROR
 * ================================================= */

function showFatalError(message) {

  hideLoading();


  const app =
    document.getElementById(
      'app'
    );


  app.style.display =
    'block';


  app.innerHTML =

    '<div class="card">' +

      '<div class="hotel">' +
        'KUIBURI HOTEL & RESORT' +
      '</div>' +

      '<h1 class="title">' +
        'KUIBURI TIME CLOCK' +
      '</h1>' +

      '<div class="message error" ' +
        'style="display:block;">' +

        '❌ ' +
        escapeHTML(message) +

      '</div>' +

    '</div>';

}


/* =================================================
 * ESCAPE HTML
 * ================================================= */

function escapeHTML(value) {

  return String(
    value || ''
  )
    .replace(
      /&/g,
      '&amp;'
    )
    .replace(
      /</g,
      '&lt;'
    )
    .replace(
      />/g,
      '&gt;'
    )
    .replace(
      /"/g,
      '&quot;'
    )
    .replace(
      /'/g,
      '&#039;'
    );

}

</script>

</body>

</html>
